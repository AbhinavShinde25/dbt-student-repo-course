models:
  - name: 'dim_listing_cleansed'
    description: this is the clean listing data 
    columns:
      - name: 'listing_id'
        description: primary key of the listing table
        data_tests:
         - unique
         - not_null

      - name: 'host_id'
        data_tests:
          - not_null
          -  relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: 'host_id'

      - name: 'room_type'
        data_tests:
          - accepted_values:
              arguments: 
                values: ['Entire home/apt',
                        'Private room',
                        'Shared room',
                        'Hotel room']
      
      - name: minimum_nights
        data_tests:
          - positive_values
  
# models:
  - name: 'dim_hosts_cleansed'
    description:  cleaned table of the host 
    columns:
     - name: 'host_id'
       description: PRimary Key of host table
       data_tests:
        - unique
        - not_null
      
     - name: 'host_name'
       description: host name should not be null
       data_tests:
        - not_null
      
     - name: 'is_superhost'
       data_tests:
        - accepted_values:
            arguments:
              values: ['t' , 'f']

